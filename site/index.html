<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="description"
      content="ZKC site for Protocol IR working papers, implementation notes, and roadmap documents."
    />
    <meta name="theme-color" content="#fafafa" />
    <script>
      (function () {
        var storageKey = "zkc-theme-preference";
        var media = window.matchMedia("(prefers-color-scheme: dark)");

        function applyTheme(theme) {
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0a0c" : "#fafafa");
        }

        function getStoredTheme() {
          try {
            return window.localStorage.getItem(storageKey);
          } catch (_) {
            return null;
          }
        }

        applyTheme(getStoredTheme() || (media.matches ? "dark" : "light"));

        if (typeof media.addEventListener === "function") {
          media.addEventListener("change", function (event) {
            if (!getStoredTheme()) {
              applyTheme(event.matches ? "dark" : "light");
            }
          });
        } else if (typeof media.addListener === "function") {
          media.addListener(function (event) {
            if (!getStoredTheme()) {
              applyTheme(event.matches ? "dark" : "light");
            }
          });
        }
      })();
    </script>
    <link data-trunk rel="copy-dir" href="public" />
    <link data-trunk rel="scss" href="style/main.scss" />
    <link
      data-trunk
      rel="rust"
      data-bin="zkc-www"
      data-wasm-opt="z"
    />
    <title>ZKC</title>
  </head>
  <body></body>
</html>
